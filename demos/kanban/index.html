<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kanban board - tinybase-element</title>
    <link rel="stylesheet" href="../demo.css" />
    <style>
      .board {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 0.75rem;
        margin-top: 1rem;
      }
      section {
        background: #f3f3f3;
        padding: 0.5rem;
        min-height: 8rem;
      }
      h2 {
        font-size: 1rem;
        text-transform: capitalize;
        margin: 0 0 0.5rem;
      }
      kanban-card {
        display: block;
        background: #fff;
        border: 1px solid #ccc;
        padding: 0.4rem;
        margin-bottom: 0.4rem;
      }
      kanban-card .text {
        display: block;
        margin-bottom: 0.25rem;
      }
      kanban-card button {
        padding: 0 0.4rem;
      }
    </style>
  </head>
  <body>
    <nav><a href="../">&larr; All demos</a></nav>
    <h1>Kanban board</h1>
    <p class="note">
      Drag cards between columns, or use the arrow buttons. A move is a <code>store.batch</code> of
      two actions. Press "+1" on a card, then move it: the count survives because the card is
      <code>renderOnce</code> and the board moves the same element. See <code>main.js</code>.
    </p>
    <kanban-board></kanban-board>
    <script type="module" src="./main.js"></script>
  </body>
</html>
